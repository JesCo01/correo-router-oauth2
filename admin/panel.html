<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Correo reenvio · Panel</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --text:#1b2230; --muted:#667085; --line:#e4e7ec;
  --brand:#2563eb; --brand-hover:#1d4ed8; --brand-ink:#ffffff; --brand-soft:#eff4ff;
  --ok:#067647; --ok-bg:#ecfdf3; --warn:#b54708; --warn-bg:#fffaeb; --err:#b42318; --err-bg:#fef3f2;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --focus:0 0 0 3px rgba(37,99,235,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1017; --surface:#141a24; --surface-2:#1a2230; --text:#e7ebf2; --muted:#98a2b3; --line:#263041;
    --brand:#3b82f6; --brand-hover:#60a5fa; --brand-ink:#0b1220; --brand-soft:#132344;
    --ok:#4ade80; --ok-bg:#0f2a1c; --warn:#fbbf24; --warn-bg:#2b2310; --err:#f87171; --err-bg:#2c1816;
    --shadow:none; --focus:0 0 0 3px rgba(59,130,246,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1017; --surface:#141a24; --surface-2:#1a2230; --text:#e7ebf2; --muted:#98a2b3; --line:#263041;
  --brand:#3b82f6; --brand-hover:#60a5fa; --brand-ink:#0b1220; --brand-soft:#132344;
  --ok:#4ade80; --ok-bg:#0f2a1c; --warn:#fbbf24; --warn-bg:#2b2310; --err:#f87171; --err-bg:#2c1816;
  --shadow:none; --focus:0 0 0 3px rgba(59,130,246,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:650}
.marca-icono{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:15px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav button:focus-visible{box-shadow:var(--focus)}
.nav .pie{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.principal{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0 auto 0 0;font-weight:650;letter-spacing:-.01em}
.acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding:24px;max-width:1080px;width:100%}
.encabezado{margin:0 0 18px}
.encabezado p{margin:4px 0 0;color:var(--muted)}

/* ---------- controles ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:550;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--text) 25%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primario{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primario:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-fantasma{background:transparent;border-color:transparent;box-shadow:none}
.btn-fantasma:hover:not(:disabled){background:var(--surface-2)}
.btn-peligro{color:var(--err)}
.btn-pequeno{padding:5px 10px;font-size:13px}
.btn-icono{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;flex:none}
.btn-icono svg{pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card-cab{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.card-cab h2,.card-cab h3{margin:0;font-size:15px;font-weight:650}
.card-cab small{color:var(--muted);display:block;font-weight:400}
.tabla-scroll{overflow-x:auto;margin:0 -18px -18px;border-radius:0 0 var(--radius) var(--radius)}
.tabla-cuentas{border-collapse:collapse;width:100%;text-align:left;font-size:13px}
.tabla-cuentas th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;background:var(--surface-2)}
.tabla-cuentas th,.tabla-cuentas td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tabla-cuentas tbody tr:hover{background:var(--surface-2)}
.tabla-cuentas .cuenta-correo{font-weight:600;overflow-wrap:anywhere;min-width:180px}
.tabla-cuentas td:not(.cuenta-correo){white-space:nowrap}
.acciones-cuenta{gap:2px;flex-wrap:nowrap}
.cuenta-editor{max-width:760px}
.cuenta-editor .acciones.mt{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
.regla-editor{max-width:880px}
.editor-pie{justify-content:flex-end;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
.tabla-reglas td:nth-child(2){white-space:normal;overflow-wrap:anywhere;min-width:150px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo>span{font-size:13px;font-weight:550;color:var(--text)}
.campo small{color:var(--muted);font-size:12px}
.campo.ancho{grid-column:1/-1}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}
.campo.error input,.campo.error select{border-color:var(--err)}
.campo .msg-error{color:var(--err);font-size:12px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.interruptor{position:relative;width:38px;height:22px;flex:none}
.interruptor input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.interruptor span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.interruptor span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.interruptor input:checked + span{background:var(--brand)}
.interruptor input:checked + span::after{transform:translateX(16px)}
.interruptor input:focus-visible + span{box-shadow:var(--focus)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button:focus-visible{box-shadow:var(--focus)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.err{color:var(--err);background:var(--err-bg);border-color:transparent}
.chip.neutro::before{background:var(--muted)}
.alerta{border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start}
.alerta.warn{background:var(--warn-bg);color:var(--warn)}
.alerta.err{background:var(--err-bg);color:var(--err)}
.alerta.ok{background:var(--ok-bg);color:var(--ok)}
.alerta.info{background:var(--brand-soft);color:var(--brand)}
.vacio{border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.vacio strong{display:block;color:var(--text);margin-bottom:4px}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.metrica{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.metrica small{color:var(--muted);font-size:12px;font-weight:550;text-transform:uppercase;letter-spacing:.04em}
.metrica b{display:block;font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.lista{display:flex;flex-direction:column;gap:8px}
.fila{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.fila .texto{min-width:0}
.fila .texto b{font-weight:600}
.fila .texto small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72ch}
.flujo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.flujo code{background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:7px;color:var(--text)}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.ruta{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface-2)}
.ruta-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ruta-cab b{font-weight:600}
.ruta-acciones{display:flex;gap:4px}
.codigo-box{font-family:ui-monospace,Consolas,monospace;font-size:22px;letter-spacing:.14em;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:inline-block}
.registro{background:#0b0f16;color:#d6dde8;border-radius:var(--radius);padding:14px;max-height:65vh;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;border:1px solid #1d2636}
.registro .e{color:#fca5a5}.registro .w{color:#fcd34d}.registro .i{color:#93c5fd}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13.5px;animation:entrar .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:var(--warn)}
@keyframes entrar{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.muted{color:var(--muted)}
.mt{margin-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:6px}
  .marca{padding:0 8px 0 0}
  .marca span{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .nav .pie{display:none}
  .topbar{padding:12px 16px}
  main{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" aria-label="Navegacion principal">
    <div class="marca"><span class="marca-icono" aria-hidden="true">✉</span><span>Correo reenvio</span></div>
    <button data-vista="resumen"><span aria-hidden="true">◎</span><span>Resumen</span></button>
    <button data-vista="cuentas"><span aria-hidden="true">◍</span><span>Cuentas</span></button>
    <button data-vista="reglas"><span aria-hidden="true">⇄</span><span>Reglas</span></button>
    <button data-vista="ajustes"><span aria-hidden="true">⚙</span><span>Ajustes</span></button>
    <button data-vista="raspberry"><span aria-hidden="true">▣</span><span>Raspberry Pi</span></button>
    <button data-vista="registro"><span aria-hidden="true">≡</span><span>Registro</span></button>
    <div class="pie">
      <button id="btn-tema" type="button"><span aria-hidden="true">◐</span><span>Tema</span></button>
    </div>
  </aside>

  <div class="principal">
    <header class="topbar">
      <h1 id="titulo">Resumen</h1>
      <div class="acciones">
        <span id="estado-servicio" class="chip neutro" role="status" aria-live="polite">Comprobando…</span>
        <button id="btn-servicio" class="btn btn-pequeno" type="button">Iniciar servicio</button>
        <button id="btn-descartar" class="btn btn-fantasma" type="button" disabled>Descartar</button>
        <button id="btn-guardar" class="btn btn-primario" type="button" disabled>Guardar cambios</button>
      </div>
    </header>
    <main id="vista" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/panel.js"></script>
</body>
</html>
